<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Flight</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow:hidden;background:#0a0814;}

#bgWrap{position:fixed;inset:0;z-index:0;}
.bg-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.5s ease;}
.bg-slide.active{opacity:1;}
#overlayLayer{position:fixed;inset:0;z-index:1;transition:background 2s ease;}

#app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:28px 24px 32px;}

.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.logo{font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.9);}
.chip{font-size:11px;color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.28);border-radius:20px;padding:4px 13px;display:none;}

.screen{display:none;flex-direction:column;flex:1;}
.screen.active{display:flex;}

.glass{background:rgba(255,255,255,0.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.28);border-radius:18px;padding:20px 22px;margin-bottom:14px;}
.glass-sm{background:rgba(255,255,255,0.11);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.2);border-radius:14px;padding:14px 18px;margin-bottom:12px;}

.flabel{font-size:10px;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:8px;}

.search-wrap{position:relative;margin-bottom:16px;}
.search-wrap:last-child{margin-bottom:0;}
.sinput{width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.28);background:rgba(255,255,255,0.16);backdrop-filter:blur(8px);font-size:14px;color:white;outline:none;font-family:inherit;transition:border-color 0.2s,background 0.2s;}
.sinput::placeholder{color:rgba(255,255,255,0.4);}
.sinput:focus{border-color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.22);}

.drop{position:absolute;top:calc(100% + 5px);left:0;right:0;background:rgba(15,8,35,0.96);backdrop-filter:blur(24px);border-radius:12px;border:1px solid rgba(255,255,255,0.1);max-height:210px;overflow-y:auto;z-index:50;display:none;}
.drop.open{display:block;}
.ditem{padding:11px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);transition:background 0.12s;}
.ditem:last-child{border-bottom:none;}
.ditem:hover{background:rgba(255,255,255,0.07);}
.dcode{font-size:13px;font-weight:700;color:#c9a8f0;}
.dcity{font-size:12px;color:rgba(255,255,255,0.45);margin-top:1px;}

.sel-pill{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.28);margin-bottom:16px;}
.sel-pill:last-child{margin-bottom:0;}
.sp-code{font-size:20px;font-weight:700;color:white;}
.sp-city{font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px;}
.sp-chg{margin-left:auto;font-size:11px;color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);border-radius:8px;padding:5px 10px;cursor:pointer;font-family:inherit;transition:background 0.15s;}
.sp-chg:hover{background:rgba(255,255,255,0.18);color:white;}

.route-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.rap{flex:1;text-align:center;}
.rap-code{font-size:28px;font-weight:700;color:white;}
.rap-city{font-size:11px;color:rgba(255,255,255,0.5);margin-top:3px;}
.rmid{flex:2;display:flex;align-items:center;gap:8px;}
.rline{flex:1;height:1px;background:rgba(255,255,255,0.28);}
.rplane{font-size:20px;color:rgba(255,255,255,0.7);}

.time-num{font-size:44px;font-weight:300;color:white;text-align:center;letter-spacing:0.03em;}
.time-sub{font-size:11px;color:rgba(255,255,255,0.45);text-align:center;margin-top:5px;letter-spacing:0.1em;text-transform:uppercase;}
.adj-row{display:flex;gap:8px;justify-content:center;margin-top:14px;}
.adj-btn{padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.9);font-size:12px;cursor:pointer;font-family:inherit;transition:background 0.15s;}
.adj-btn:hover{background:rgba(255,255,255,0.22);}

.main-btn{width:100%;padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.18);backdrop-filter:blur(8px);color:white;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:0.04em;transition:background 0.2s;margin-top:auto;}
.main-btn:hover{background:rgba(255,255,255,0.28);}
.main-btn:disabled{opacity:0.3;cursor:default;}

.bpf-label{font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.1em;}
.bpf-val{font-size:15px;font-weight:600;color:white;margin-top:4px;}
.bpf-val.lg{font-size:26px;}
.bpf-val.sm{font-size:12px;font-weight:400;color:rgba(255,255,255,0.5);margin-top:2px;}
.bp-row{display:flex;justify-content:space-between;margin-bottom:16px;}
.bp-row:last-child{margin-bottom:0;}
.div{height:1px;background:rgba(255,255,255,0.12);margin:14px 0;}

.status-msg{font-size:14px;color:rgba(255,255,255,0.75);font-style:italic;text-align:center;margin-bottom:18px;min-height:22px;}

.scene-label{font-size:11px;color:rgba(255,255,255,0.45);text-align:center;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;min-height:16px;transition:opacity 0.5s;}

.timer-wrap{text-align:center;margin-bottom:16px;}
.timer-num{font-size:64px;font-weight:300;color:white;letter-spacing:0.03em;font-variant-numeric:tabular-nums;line-height:1;}
.timer-lbl{font-size:11px;color:rgba(255,255,255,0.45);margin-top:8px;letter-spacing:0.14em;text-transform:uppercase;}

.prog{height:4px;background:rgba(255,255,255,0.15);border-radius:10px;margin-bottom:16px;overflow:hidden;}
.prog-fill{height:100%;border-radius:10px;background:rgba(255,255,255,0.7);transition:width 1s linear;}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.stat{background:rgba(255,255,255,0.11);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.18);border-radius:12px;padding:12px 8px;text-align:center;}
.sv{font-size:16px;font-weight:600;color:white;}
.sl{font-size:10px;color:rgba(255,255,255,0.45);margin-top:4px;text-transform:uppercase;letter-spacing:0.08em;}

.alert{background:rgba(255,210,180,0.18);border:1px solid rgba(255,190,150,0.3);border-radius:12px;padding:12px 16px;font-size:13px;color:rgba(255,240,220,0.92);margin-bottom:14px;display:none;}
.alert.show{display:block;}

.ctrl-row{display:flex;gap:8px;margin-top:auto;}
.ctrl-btn{flex:1;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.13);color:white;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:background 0.15s;}
.ctrl-btn:hover{background:rgba(255,255,255,0.22);}

.dest-photo{display:none;}
.dest-name{font-size:26px;font-weight:700;color:white;margin-bottom:4px;}
.dest-sub{font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:16px;}
.landed-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.lstat{padding:16px;background:rgba(255,255,255,0.13);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);border-radius:12px;}
.lsv{font-size:22px;font-weight:600;color:white;}
.lsl{font-size:10px;color:rgba(255,255,255,0.45);margin-top:4px;text-transform:uppercase;letter-spacing:0.08em;}

.drop::-webkit-scrollbar{width:4px;}
.drop::-webkit-scrollbar-track{background:transparent;}
.drop::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);border-radius:2px;}
</style>
</head>
<body>

<div id="bgWrap">
  <div class="bg-slide active" id="bg0"></div>
  <div class="bg-slide" id="bg1"></div>
</div>
<div id="overlayLayer"></div>

<div id="app">
  <div class="hdr">
    <div class="logo">Study Flight</div>
    <div class="chip" id="chip">First Class</div>
  </div>

  <!-- PICK -->
  <div class="screen active" id="sPick">
    <div class="glass">
      <div class="flabel">Departing from</div>
      <div id="depWrap">
        <div class="search-wrap">
          <input class="sinput" id="depIn" placeholder="City or airport code..." autocomplete="off"/>
          <div class="drop" id="depDrop"></div>
        </div>
      </div>
      <div class="flabel">Flying to</div>
      <div id="arrWrap">
        <div class="search-wrap">
          <input class="sinput" id="arrIn" placeholder="City or airport code..." autocomplete="off"/>
          <div class="drop" id="arrDrop"></div>
        </div>
      </div>
    </div>
    <div id="routeSec" style="display:none;flex-direction:column;flex:1;">
      <div class="glass-sm">
        <div class="route-row">
          <div class="rap"><div class="rap-code" id="rDep"></div><div class="rap-city" id="rDepC"></div></div>
          <div class="rmid"><div class="rline"></div><div class="rplane">✈</div><div class="rline"></div></div>
          <div class="rap"><div class="rap-code" id="rArr"></div><div class="rap-city" id="rArrC"></div></div>
        </div>
        <div class="time-num" id="tBig">—</div>
        <div class="time-sub">estimated flight time · adjust below</div>
        <div class="adj-row">
          <button class="adj-btn" onclick="adj(-60)">− 1h</button>
          <button class="adj-btn" onclick="adj(-30)">− 30m</button>
          <button class="adj-btn" onclick="adj(30)">+ 30m</button>
          <button class="adj-btn" onclick="adj(60)">+ 1h</button>
        </div>
      </div>
      <button class="main-btn" onclick="goBoard()">Board flight</button>
    </div>
  </div>

  <!-- BOARDING -->
  <div class="screen" id="sBoard">
    <div class="glass">
      <div class="bp-row">
        <div>
          <div class="bpf-label">From</div>
          <div class="bpf-val lg" id="bDep"></div>
          <div class="bpf-val sm" id="bDepC"></div>
        </div>
        <div style="text-align:right">
          <div class="bpf-label">To</div>
          <div class="bpf-val lg" id="bArr"></div>
          <div class="bpf-val sm" style="text-align:right" id="bArrC"></div>
        </div>
      </div>
      <div class="div"></div>
      <div class="bp-row">
        <div><div class="bpf-label">Duration</div><div class="bpf-val" id="bDur"></div></div>
        <div style="text-align:right"><div class="bpf-label">Gate</div><div class="bpf-val" id="bGate"></div></div>
      </div>
      <div class="bp-row" style="margin-bottom:0">
        <div><div class="bpf-label">Cabin</div><div class="bpf-val" style="color:#d4b0f0">First Class</div></div>
        <div style="text-align:right"><div class="bpf-label">Seat</div><div class="bpf-val" id="bSeat"></div></div>
      </div>
    </div>
    <div class="status-msg" id="boardMsg"></div>
    <div class="scene-label" id="boardSceneLbl"></div>
    <div class="timer-wrap">
      <div class="timer-num" id="boardNum">5:00</div>
      <div class="timer-lbl">boarding closes in</div>
    </div>
    <div class="prog"><div class="prog-fill" id="boardProg" style="width:100%"></div></div>
    <div class="ctrl-row">
      <button class="ctrl-btn" onclick="skipBoard()">Skip to takeoff</button>
    </div>
  </div>

  <!-- FLIGHT -->
  <div class="screen" id="sFlight">
    <div class="alert" id="alertBanner">Final approach — start wrapping up and stow your belongings.</div>
    <div class="scene-label" id="flightSceneLbl"></div>
    <div class="stats">
      <div class="stat"><div class="sv" id="sRem">—</div><div class="sl">Remaining</div></div>
      <div class="stat"><div class="sv" id="sEl">—</div><div class="sl">Elapsed</div></div>
      <div class="stat"><div class="sv" id="sPct">0%</div><div class="sl">Progress</div></div>
    </div>
    <div class="prog"><div class="prog-fill" id="flightProg" style="width:0%"></div></div>
    <div class="timer-wrap">
      <div class="timer-num" id="flightNum">—</div>
      <div class="timer-lbl" id="flightLbl">in flight</div>
    </div>
    <div class="ctrl-row" style="margin-top:auto">
      <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()">Pause</button>
      <button class="ctrl-btn" onclick="endEarly()">End session</button>
    </div>
  </div>

  <!-- LANDED -->
  <div class="screen" id="sLanded">
    <img class="dest-photo" id="destImg" src="" alt=""/>
    <div class="dest-name" id="destName"></div>
    <div class="dest-sub" id="destSub"></div>
    <div class="landed-grid">
      <div class="lstat"><div class="lsv" id="lTime"></div><div class="lsl">Session length</div></div>
      <div class="lstat"><div class="lsv" id="lRoute"></div><div class="lsl">Route flown</div></div>
    </div>
    <button class="main-btn" onclick="resetApp()">Book another flight</button>
  </div>
</div>

  {url:"https://images.unsplash.com/photo-1519690889869-e705e59f72e1?w=1600&q=85&auto=format&fit=crop",label:"Resting at 35,000 ft",ov:"rgba(20,12,48,0.50)"},

  {url:"https://images.unsplash.com/photo-1553484771-8bbd4f5e0e6d?w=1600&q=85&auto=format&fit=crop",label:"Packing up your notes",ov:"rgba(22,15,52,0.46)"},

const LANDING_SCENES=[
  {url:"https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=1600&q=85&auto=format&fit=crop",label:"Descending through clouds",ov:"rgba(20,15,40,0.38)",fb:"linear-gradient(135deg,#1a1530,#2a2050)"},
  {url:"https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=1600&q=85&auto=format&fit=crop",label:"City lights below",ov:"rgba(20,15,50,0.48)"},
  {url:"https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1600&q=85&auto=format&fit=crop",label:"Touching down",ov:"rgba(28,18,58,0.50)"},
  {url:"https://images.unsplash.com/photo-1530521954074-e64f6810b32d?w=1600&q=85&auto=format&fit=crop",label:"Walking through the terminal",ov:"rgba(30,20,60,0.48)"},
];

const PICK_BG={url:"https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1600&q=85&auto=format&fit=crop",ov:"rgba(20,15,40,0.40)"};

const MSGS=["Your suite is ready — welcome aboard.","Last call for priority boarding.","Make sure your flat bed is reclined to your liking.","We'll be pushing back from the gate shortly.","Stow your items and enjoy the journey."];
const GATES=["A1","B2","C4","D1","E3","F1","G2"];
const SEATS=["1A","1K","2A","2K","3A","3K"];

let dep=null,arr=null,totalMin=0,timerSec=0,boardSec=300;
let mainIv=null,boardIv=null,paused=false;
let sceneIv=null,curSceneIdx=0,curScenes=[];
let bgActive=0; // which bg-slide is currently showing

// ── BACKGROUND CROSSFADE ──
function setBgSlide(url, ov, fallback) {
  const next = (bgActive + 1) % 2;
  const el = document.getElementById("bg" + next);
  const prev = document.getElementById("bg" + bgActive);

  // Test if image loads; if not, use fallback gradient
  const testImg = new Image();
  testImg.onload = () => {
    // Clear the shorthand FIRST. `background` includes background-image,
    // so setting it after would wipe out the image we just set.
    el.style.background = '';
    el.style.backgroundImage = `url('${url}')`;
    el.getBoundingClientRect();
    prev.classList.remove("active");
    el.classList.add("active");
    bgActive = next;
  };
  testImg.onerror = () => {
    el.style.backgroundImage = '';
    el.style.background = fallback || 'linear-gradient(135deg,#0a1020,#1a2540)';
    el.getBoundingClientRect();
    prev.classList.remove("active");
    el.classList.add("active");
    bgActive = next;
  };
  testImg.src = url;
  document.getElementById("overlayLayer").style.background = ov;
}

function startScenes(scenes,labelElId,interval){
  clearInterval(sceneIv);
  curScenes=scenes;
  curSceneIdx=0;
  const lbl=document.getElementById(labelElId);
  function show(i){
    const s=scenes[i];
    setBgSlide(s.url, s.ov, s.fb || 'linear-gradient(135deg,#0a1020,#1a2540)');
    if(lbl)lbl.textContent=s.label;
  }
  show(0);
  sceneIv=setInterval(()=>{
    curSceneIdx=(curSceneIdx+1)%scenes.length;
    show(curSceneIdx);
  },interval);
}

// ── AUDIO ENGINE ──
let audioCtx=null,ambientNodes=[],audioStarted=false;
let ambientLoopT=null,musicLoopT=null,beatLoopT=null;
let musicGain=null,ambGain=null;

function initAudio(){
  if(audioStarted)return;
  audioStarted=true;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  musicGain=audioCtx.createGain();
  musicGain.gain.setValueAtTime(0,audioCtx.currentTime);
  musicGain.connect(audioCtx.destination);
  ambGain=audioCtx.createGain();
  ambGain.gain.setValueAtTime(0,audioCtx.currentTime);
  ambGain.connect(audioCtx.destination);
  startAmbient();
  startLofi();
}

function startAmbient(){
  // engine / cabin hum — looped noise
  const bufSize=audioCtx.sampleRate*4;
  const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*0.032;
  const src=audioCtx.createBufferSource();
  src.buffer=buf;src.loop=true;
  const lp=audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=360;
  src.connect(lp);lp.connect(ambGain);src.start();
  ambientNodes.push(src);
  // sub drone — pressurised cabin feel
  [52,104].forEach(f=>{
    const osc=audioCtx.createOscillator();osc.type="sine";osc.frequency.value=f;
    const g=audioCtx.createGain();g.gain.value=0.009;
    osc.connect(g);g.connect(ambGain);osc.start();
    ambientNodes.push(osc);
  });
  ambGain.gain.linearRampToValueAtTime(0.24,audioCtx.currentTime+4);
  // occasional subtle swell (turbulence / AC)
  function pulse(){
    const t=audioCtx.currentTime;
    ambGain.gain.linearRampToValueAtTime(0.28+Math.random()*0.12,t+5);
    ambGain.gain.linearRampToValueAtTime(0.18,t+14);
    ambientLoopT=setTimeout(pulse,16000+Math.random()*8000);
  }
  ambientLoopT=setTimeout(pulse,16000);

  // soft cabin ding every ~60-90s
  function ding(){
    const t=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();osc.type="sine";osc.frequency.value=880;
    const env=audioCtx.createGain();
    env.gain.setValueAtTime(0,t);
    env.gain.linearRampToValueAtTime(0.18,t+0.05);
    env.gain.exponentialRampToValueAtTime(0.001,t+1.8);
    osc.connect(env);env.connect(audioCtx.destination);
    osc.start(t);osc.stop(t+2);
    setTimeout(ding,60000+Math.random()*30000);
  }
  setTimeout(ding,20000+Math.random()*15000);
}

function startLofi(){
  const bpm=70,step=60/bpm;
  const chords=[[261.63,329.63,392],[246.94,311.13,369.99],[220,277.18,329.63],[196,261.63,329.63]];
  let ci=0;
  function playChord(){
    if(!audioCtx)return;
    const now=audioCtx.currentTime;
    chords[ci%4].forEach(freq=>{
      const osc=audioCtx.createOscillator();
      osc.type="triangle";osc.frequency.value=freq*0.5;
      const env=audioCtx.createGain();
      env.gain.setValueAtTime(0,now);
      env.gain.linearRampToValueAtTime(0.05,now+0.45);
      env.gain.linearRampToValueAtTime(0.022,now+2.2);
      env.gain.linearRampToValueAtTime(0,now+step*8);
      const lp=audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=820;
      osc.connect(lp);lp.connect(env);env.connect(musicGain);
      osc.start(now);osc.stop(now+step*8);
    });
    ci++;
    musicLoopT=setTimeout(playChord,step*8*1000);
  }
  function kick(when){
    if(!audioCtx)return;
    const osc=audioCtx.createOscillator(),env=audioCtx.createGain();
    osc.frequency.setValueAtTime(78,when);
    osc.frequency.exponentialRampToValueAtTime(28,when+0.15);
    env.gain.setValueAtTime(0.42,when);
    env.gain.exponentialRampToValueAtTime(0.001,when+0.22);
    osc.connect(env);env.connect(musicGain);
    osc.start(when);osc.stop(when+0.28);
  }
  function hihat(when,vol=0.06){
    if(!audioCtx)return;
    const b=audioCtx.createBuffer(1,audioCtx.sampleRate*0.05,audioCtx.sampleRate);
    const dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*vol;
    const src=audioCtx.createBufferSource();src.buffer=b;
    const hp=audioCtx.createBiquadFilter();hp.type="highpass";hp.frequency.value=7200;
    const env=audioCtx.createGain();
    env.gain.setValueAtTime(vol,when);
    env.gain.exponentialRampToValueAtTime(0.001,when+0.055);
    src.connect(hp);hp.connect(env);env.connect(musicGain);src.start(when);
  }
  function doBeat(){
    if(!audioCtx)return;
    const now=audioCtx.currentTime;
    [0,step*2,step*4,step*6].forEach(t=>kick(now+t));
    [0,step,step*1.5,step*2,step*3,step*3.5,step*4,step*5,step*5.5,step*6,step*7,step*7.5]
      .forEach(t=>hihat(now+t,0.032+Math.random()*0.022));
    beatLoopT=setTimeout(doBeat,step*8*1000);
  }
  musicGain.gain.linearRampToValueAtTime(0.52,audioCtx.currentTime+6);
  setTimeout(playChord,700);
  setTimeout(doBeat,1000);
}

function stopAllAudio(){
  clearTimeout(ambientLoopT);clearTimeout(musicLoopT);clearTimeout(beatLoopT);
  ambientNodes.forEach(n=>{try{n.stop();}catch(e){}});
  ambientNodes=[];
  if(audioCtx){audioCtx.close();audioCtx=null;}
  audioStarted=false;musicGain=null;ambGain=null;
}
function pauseAudio(){if(audioCtx)audioCtx.suspend();}
function resumeAudio(){if(audioCtx)audioCtx.resume();}

// ── APP LOGIC ──
function ftMin(a,b){return FT[a+"-"+b]||FT[b+"-"+a]||Math.round(160+Math.random()*480);}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;if(h>0)return`${h}:${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`;return`${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`;}
function fmtM(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?`${h}h ${m}m`:`${m}m`;}

function setupSearch(inId,dropId,wrapId,isArr){
  const inp=document.getElementById(inId),dr=document.getElementById(dropId);
  if(!inp)return;
  inp.addEventListener("input",()=>{
    const q=inp.value.toLowerCase().trim();
    if(!q){dr.classList.remove("open");return;}
    const hits=AIRPORTS.filter(a=>a.code.toLowerCase().includes(q)||a.city.toLowerCase().includes(q)||a.name.toLowerCase().includes(q)).slice(0,9);
    dr.innerHTML=hits.map(a=>`<div class="ditem" onclick="pick('${a.code}','${wrapId}',${isArr})"><div class="dcode">${a.code}</div><div class="dcity">${a.city} — ${a.name}</div></div>`).join("");
    dr.classList.toggle("open",hits.length>0);
  });
  document.addEventListener("click",e=>{if(!inp.contains(e.target)&&!dr.contains(e.target))dr.classList.remove("open");});
}

function pick(code,wrapId,isArr){
  const ap=AIRPORTS.find(a=>a.code===code);
  if(isArr)arr=ap;else dep=ap;
  document.getElementById(wrapId).innerHTML=`<div class="sel-pill"><div><div class="sp-code">${ap.code}</div><div class="sp-city">${ap.city}</div></div><button class="sp-chg" onclick="clearPick('${wrapId}',${isArr})">Change</button></div>`;
  updateRoute();
}

function clearPick(wrapId,isArr){
  if(isArr)arr=null;else dep=null;
  const inId=isArr?"arrIn":"depIn",drId=isArr?"arrDrop":"depDrop";
  document.getElementById(wrapId).innerHTML=`<div class="search-wrap"><input class="sinput" id="${inId}" placeholder="City or airport code..." autocomplete="off"/><div class="drop" id="${drId}"></div></div>`;
  setupSearch(inId,drId,wrapId,isArr);
  updateRoute();
}

function updateRoute(){
  const sec=document.getElementById("routeSec");
  if(!dep||!arr){sec.style.display="none";return;}
  sec.style.display="flex";
  document.getElementById("rDep").textContent=dep.code;
  document.getElementById("rDepC").textContent=dep.city;
  document.getElementById("rArr").textContent=arr.code;
  document.getElementById("rArrC").textContent=arr.city;
  totalMin=ftMin(dep.code,arr.code);
  refreshTime();
}

function refreshTime(){
  const h=Math.floor(totalMin/60),m=totalMin%60;
  document.getElementById("tBig").textContent=h>0?`${h}h ${String(m).padStart(2,"0")}m`:`${m}m`;
}

function adj(d){totalMin=Math.max(15,Math.min(totalMin+d,900));refreshTime();}

function goBoard(){
  document.getElementById("bDep").textContent=dep.code;
  document.getElementById("bDepC").textContent=dep.city;
  document.getElementById("bArr").textContent=arr.code;
  document.getElementById("bArrC").textContent=arr.city;
  const h=Math.floor(totalMin/60),m=totalMin%60;
  document.getElementById("bDur").textContent=h>0?`${h}h ${m}m`:`${m}m`;
  document.getElementById("bGate").textContent=GATES[Math.floor(Math.random()*GATES.length)];
  document.getElementById("bSeat").textContent=SEATS[Math.floor(Math.random()*SEATS.length)];
  document.getElementById("boardMsg").textContent=MSGS[Math.floor(Math.random()*MSGS.length)];
  document.getElementById("chip").style.display="";
  show("sBoard");
  initAudio();
  startScenes(BOARDING_SCENES,"boardSceneLbl",22000);
  boardSec=300;
  clearInterval(boardIv);
  boardIv=setInterval(()=>{
    boardSec--;
    document.getElementById("boardNum").textContent=fmt(boardSec);
    document.getElementById("boardProg").style.width=(boardSec/300*100)+"%";
    if(boardSec%60===0&&boardSec>0)document.getElementById("boardMsg").textContent=MSGS[Math.floor(Math.random()*MSGS.length)];
    if(boardSec<=0){clearInterval(boardIv);startFlight();}
  },1000);
}

function skipBoard(){clearInterval(boardIv);startFlight();}

function startFlight(){
  show("sFlight");
  timerSec=totalMin*60;
  paused=false;
  // cycle flight scenes based on total duration
  const sceneInterval=Math.max(18000,Math.floor((timerSec/FLIGHT_SCENES.length)*1000*0.85));
  startScenes(FLIGHT_SCENES,"flightSceneLbl",sceneInterval);
  updateFlightUI();
  clearInterval(mainIv);
  mainIv=setInterval(()=>{
    if(paused)return;
    timerSec--;
    updateFlightUI();
    if(timerSec<=0){clearInterval(mainIv);land();}
  },1000);
}

function updateFlightUI(){
  const total=totalMin*60,elapsed=total-timerSec,pct=Math.round(elapsed/total*100);
  document.getElementById("flightNum").textContent=fmt(timerSec);
  document.getElementById("sRem").textContent=fmtM(timerSec);
  document.getElementById("sEl").textContent=fmtM(elapsed);
  document.getElementById("sPct").textContent=pct+"%";
  document.getElementById("flightProg").style.width=pct+"%";
  const last5=timerSec<=300&&timerSec>0;
  document.getElementById("alertBanner").classList.toggle("show",last5);
  document.getElementById("flightLbl").textContent=last5?"preparing to land":"in flight";
  if(last5&&curScenes!==LANDING_SCENES){
    startScenes(LANDING_SCENES,"flightSceneLbl",18000);
  }
}

function togglePause(){
  paused=!paused;
  document.getElementById("pauseBtn").textContent=paused?"Resume":"Pause";
  if(paused)pauseAudio();else resumeAudio();
}

function endEarly(){clearInterval(mainIv);land(true);}

function land(early){
  clearInterval(mainIv);clearInterval(sceneIv);
  const total=totalMin*60,studied=total-(early?timerSec:0);
  setBgSlide(arr.img,"rgba(30,18,58,0.52)");
  document.getElementById("chip").style.display="none";
  // destination photo removed (offline-safe)
  document.getElementById("destName").textContent=`Welcome to ${arr.city}`;
  document.getElementById("destSub").textContent="You've landed. Session complete.";
  document.getElementById("lTime").textContent=fmtM(studied);
  document.getElementById("lRoute").textContent=`${dep.code} → ${arr.code}`;
  show("sLanded");
  setTimeout(stopAllAudio,3000);
}

function resetApp(){
  clearInterval(mainIv);clearInterval(boardIv);clearInterval(sceneIv);
  stopAllAudio();
  dep=null;arr=null;paused=false;timerSec=0;boardSec=300;curScenes=[];
  document.getElementById("depWrap").innerHTML=`<div class="search-wrap"><input class="sinput" id="depIn" placeholder="City or airport code..." autocomplete="off"/><div class="drop" id="depDrop"></div></div>`;
  document.getElementById("arrWrap").innerHTML=`<div class="search-wrap"><input class="sinput" id="arrIn" placeholder="City or airport code..." autocomplete="off"/><div class="drop" id="arrDrop"></div></div>`;
  document.getElementById("routeSec").style.display="none";
  document.getElementById("chip").style.display="none";
  setupSearch("depIn","depDrop","depWrap",false);
  setupSearch("arrIn","arrDrop","arrWrap",true);
  setBgSlide(PICK_BG.url,PICK_BG.ov);
  show("sPick");
}

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ── INIT ──
setBgSlide(PICK_BG.url,PICK_BG.ov);
setupSearch("depIn","depDrop","depWrap",false);
setupSearch("arrIn","arrDrop","arrWrap",true);
</script>
